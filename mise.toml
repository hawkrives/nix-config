
[tasks."update-and-commit"]
run = "nix flake update --commit-lock-file"

[tasks."build"]
run = 'mise run "$(hostname)"'
env.ACTION = "build"

[tasks."switch"]
run = 'mise run "$(hostname)"'
env.ACTION = "switch"

[tasks."ask"]
run = 'mise run "$(hostname)" -- --ask'
env.ACTION = "switch"

[tasks."Techcyte-DGQJV434PF"]
run = 'nh darwin ${ACTION} --hostname "$MISE_TASK_NAME" .'

[tasks."potato-bunny"]
run = 'nh os ${ACTION} --hostname "$MISE_TASK_NAME" .'

[tasks."nutmeg"]
run = 'nh os ${ACTION} --hostname "$MISE_TASK_NAME" .'

# Remote deploys come in :ask and :yes variants rather than one task that always
# passes --ask. --ask needs a real TTY: non-interactively it either fails with
# "The input device is not a TTY" or, if something fakes a TTY, wedges silently —
# a deploy that reports nothing and activates nothing, which is easy to misread as
# success. Splitting them means the automatable path has no prompt to work around,
# and reviewing the diff before activating is a deliberate choice.

[tasks."tuckles:ask"]
run = 'nh os switch .#tuckles --target-host haru@tuckles.local --hostname tuckles -e passwordless --ask'

[tasks."tuckles:yes"]
run = 'nh os switch .#tuckles --target-host haru@tuckles.local --hostname tuckles -e passwordless'

[tasks."pantry:ask"]
run = 'nh os switch .#pantry --target-host nix@pantry.local --hostname pantry -e passwordless --ask'

[tasks."pantry:yes"]
run = 'nh os switch .#pantry --target-host nix@pantry.local --hostname pantry -e passwordless'

# channel-archive-status ships with the channelArchive module, which only nutmeg
# enables, so run it directly there and over ssh from anywhere else. The `nutmeg`
# ssh alias is mDNS .local, so this works on the LAN; off-LAN use `nutmeg-ts`.
[tasks."channels"]
description = "Report on the yt-dlp channel archivers (last check, new/left, size)"
run = '''
if [ "$(hostname)" = nutmeg ]; then
  exec channel-archive-status "$@"
fi
exec ssh nutmeg channel-archive-status "$@"
'''

# ── nixtamal (nutmeg only, experimental) ──────────────────────────────────────
# nutmeg can also be built without flakes, from ./default.nix + nix/tamal/.
# See README.md § "Building nutmeg without flakes". The flake still owns
# tuckles, pantry and Techcyte; these tasks do not touch them.

[tasks."nutmeg:tamal"]
description = "Build nutmeg from the non-flake (nixtamal) entry point"
run = 'nh os ${ACTION:-build} --file . nixosConfigurations.nutmeg --hostname nutmeg'

# Replaces `nix flake update` for the nixtamal-pinned inputs. Uses the nixtamal
# that ./default.nix pins, not whatever happens to be on PATH, so a refresh is
# reproducible.
[tasks."tamal:refresh"]
description = "Refresh + relock the nixtamal inputs (cf. update-and-commit)"
run = '''
nixtamal=$(nix-build --no-out-link -A packages.nixtamal)/bin/nixtamal
"$nixtamal" refresh "$@"
"$nixtamal" check-soundness
'''

[tasks."tamal:status"]
description = "Show which nixtamal inputs have drifted from their fresh-cmd"
run = '''
nixtamal=$(nix-build --no-out-link -A packages.nixtamal)/bin/nixtamal
"$nixtamal" list-stale
'''
